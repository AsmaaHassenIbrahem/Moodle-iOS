name: MoodleCandidate
options:
  bundleIdPrefix: io.qzz
packages:
  Swinject:
    url: https://github.com/Swinject/Swinject.git
    from: 2.9.1
  Moya:
    url: https://github.com/Moya/Moya.git
    from: 15.0.0
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    PRODUCT_BUNDLE_IDENTIFIER: io.qzz.moodlecandidate
    GENERATE_INFOPLIST_FILE: YES
targets:
  MoodleCandidate:
    type: application
    platform: iOS
    sources:
      - MoodleCandidate
    dependencies:
      - package: Swinject
      - package: Moya
    settings:
      base:
        PRODUCT_NAME: MoodleCandidate
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
